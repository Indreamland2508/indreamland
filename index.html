<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lời chúc gửi người thương</title>
<meta name="description" content="Một góc nhỏ gửi lời chúc nhân dịp Tết và Giáng Sinh.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Dancing+Script:wght@600;700&display=swap">
<style>
:root{--bg:#5c0a10;--bg2:#8e1018;--accent:#f5c04a;--ink:#fff4dc;--card:rgba(255,244,220,.1);--line:rgba(245,192,74,.45)}
[data-theme="noel"]{--bg:#0f3d26;--bg2:#17603b;--accent:#ffffff;--ink:#f4fbf6;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.4);--red:#d62d3a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.7;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;transition:background .6s}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:22px 18px 70px;text-align:center}
nav{display:flex;gap:8px;justify-content:center;margin-bottom:34px}
nav button{font:inherit;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 20px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.to{margin:0;font-size:1.05rem;opacity:.9}
h1{font-family:"Dancing Script",cursive;font-weight:700;font-size:clamp(2.8rem,11vw,5.2rem);line-height:1.1;margin:8px 0 18px;color:var(--accent)}
.meaning{max-width:52ch;margin:0 auto 34px;font-size:1.05rem}
.wishes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}
.wish{font:inherit;color:inherit;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 16px;min-height:150px;cursor:pointer}
.wish .t{display:block;font-family:"Dancing Script",cursive;font-size:1.7rem;color:var(--accent)}
.wish .b{display:none;margin-top:6px;font-size:.98rem}
.wish[aria-expanded="true"] .b{display:block}
.wish[aria-expanded="true"] .h{display:none}
.hint{font-size:.88rem;opacity:.75;margin:0 0 40px}
.from{font-family:"Dancing Script",cursive;font-size:1.8rem;margin:0 0 50px}
.make{border-top:1px solid var(--line);padding-top:26px;font-size:.95rem}
.make h2{font-size:1rem;font-weight:700;margin:0 0 12px}
.make .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.make input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);width:170px}
.make .copy{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 16px;background:var(--accent);color:var(--bg);cursor:pointer}
#msg{min-height:1.5em;margin:10px 0 0;opacity:.85}
.fall{position:fixed;top:-10%;z-index:0;pointer-events:none;color:var(--accent);opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
@media(prefers-reduced-motion:reduce){.fall{display:none}}
</style>
</head>
<body>
<main>
<nav aria-label="Chọn dịp lễ">
  <button type="button" data-t="tet" aria-pressed="true">Tết</button>
  <button type="button" data-t="noel" aria-pressed="false">Giáng Sinh</button>
</nav>
<p class="to" id="to"></p>
<h1 id="title"></h1>
<p class="meaning" id="meaning"></p>
<div class="wishes" id="wishes"></div>
<p class="hint">Chạm vào từng thẻ để mở lời chúc.</p>
<p class="from" id="from"></p>
<section class="make">
  <h2>Tạo đường link để gửi tặng</h2>
  <div class="row">
    <input id="inTo" placeholder="Tên người nhận" aria-label="Tên người nhận">
    <input id="inFrom" placeholder="Tên của bạn" aria-label="Tên của bạn">
    <button class="copy" id="copy" type="button">Sao chép link</button>
  </div>
  <p id="msg" role="status"></p>
</section>
</main>
<script>
var D={
tet:{title:"Chúc mừng năm mới",meaning:"Tết là lúc cả nhà quây quần, khép lại một năm cũ và mở ra một năm mới thật bình an.",petal:"✿",
w:[["Sức khỏe","Chúc bạn một năm dồi dào sức khỏe để làm trọn những điều mình yêu thích."],
["Bình an","Mong mọi lo toan nhẹ đi, mỗi ngày đều bình yên và nhiều tiếng cười."],
["Sum vầy","Mong cả nhà luôn đủ đầy, bên nhau trong những bữa cơm ấm áp."]]},
noel:{title:"Giáng Sinh an lành",meaning:"Giáng Sinh là mùa của yêu thương và sẻ chia, của những cái ôm thật lâu giữa trời lạnh.",petal:"❄",
w:[["Ấm áp","Chúc bạn có một mùa đông ấm áp bên những người mình thương."],
["Niềm vui","Mong mỗi ngày của bạn đều có một điều nhỏ bé khiến bạn mỉm cười."],
["Biết ơn","Cảm ơn bạn vì đã luôn ở đó, chúc bạn một mùa lễ trọn vẹn."]]}};
var q=new URLSearchParams(location.search),cur=q.get("t")==="noel"?"noel":"tet";
var $=function(i){return document.getElementById(i)};
function render(){
var d=D[cur];document.documentElement.dataset.theme=cur;
$("title").textContent=d.title;$("meaning").textContent=d.meaning;
var to=q.get("to"),fr=q.get("from");
$("to").textContent=to?"Gửi "+to:"";
$("from").textContent=fr?"Thương yêu, "+fr:"";
var w=$("wishes");w.innerHTML="";
d.w.forEach(function(x){var b=document.createElement("button");b.type="button";b.className="wish";b.setAttribute("aria-expanded","false");
var t=document.createElement("span");t.className="t";t.textContent=x[0];
var h=document.createElement("span");h.className="h";h.textContent="Mở ra";
var m=document.createElement("span");m.className="b";m.textContent=x[1];
b.append(t,h,m);b.onclick=function(){b.setAttribute("aria-expanded",b.getAttribute("aria-expanded")==="true"?"false":"true")};w.appendChild(b)});
document.querySelectorAll("nav button").forEach(function(n){n.setAttribute("aria-pressed",n.dataset.t===cur)});
document.querySelectorAll(".fall").forEach(function(e){e.remove()});
for(var i=0;i<22;i++){var f=document.createElement("span");f.className="fall";f.textContent=d.petal;
f.style.left=Math.random()*100+"%";f.style.fontSize=(12+Math.random()*16)+"px";
f.style.animationDuration=(9+Math.random()*10)+"s";f.style.animationDelay=(-Math.random()*15)+"s";document.body.appendChild(f)}}
document.querySelectorAll("nav button").forEach(function(n){n.onclick=function(){cur=n.dataset.t;render()}});
$("copy").onclick=function(){
var u=new URL(location.href);u.search="";u.searchParams.set("t",cur);
if($("inTo").value.trim())u.searchParams.set("to",$("inTo").value.trim());
if($("inFrom").value.trim())u.searchParams.set("from",$("inFrom").value.trim());
var s=u.toString();
function ok(){$("msg").textContent="Đã sao chép link. Bạn có thể dán và gửi ngay."}
function no(){$("msg").textContent="Hãy sao chép link này: "+s}
try{navigator.clipboard.writeText(s).then(ok,no)}catch(e){no()}};
render();
</script>
</body>
</html>
